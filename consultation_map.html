<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Thesis Consultation Map</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
  <style>
    html, body, #map { height: 100%; margin: 0; }
    body { font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
    .panel {
      position: absolute;
      z-index: 500;
      top: 12px;
      right: 12px;
      width: min(360px, calc(100vw - 32px));
      max-height: calc(100vh - 32px);
      overflow: auto;
      background: #fff;
      border: 1px solid #cfd5dc;
      border-radius: 8px;
      box-shadow: 0 8px 28px rgba(0,0,0,.18);
      padding: 12px;
      color: #1f2933;
    }
    h1 { font-size: 16px; margin: 0 0 8px; }
    h2 { font-size: 13px; margin: 14px 0 6px; color: #465564; }
    label { display: flex; align-items: center; gap: 8px; margin: 6px 0; font-size: 13px; }
    input { width: 16px; height: 16px; }
    .note { font-size: 12px; line-height: 1.35; color: #5d6975; margin-top: 8px; }
    .legend { display: grid; grid-template-columns: 14px 1fr; gap: 5px 8px; font-size: 12px; margin-top: 8px; }
    .swatch { width: 12px; height: 12px; border-radius: 50%; margin-top: 2px; }
    .line { border-radius: 0; height: 3px; margin-top: 7px; }
    .status { font-size: 12px; color: #465564; margin-top: 10px; white-space: pre-line; }
  </style>
</head>
<body>
  <div id="map"></div>
  <aside class="panel">
    <h1>Thesis Consultation Map</h1>
    <div class="note">Existing GeoJSON resources loaded from <code>thesis_main/QGIS/data</code>. Toggle layers depending on the question.</div>

    <h2>Core Layers</h2>
    <label><input type="checkbox" data-layer="lgu" checked> LGU boundaries</label>
    <label><input type="checkbox" data-layer="listings" checked> Listings / ABT points</label>
    <label><input type="checkbox" data-layer="valuation"> Valuation gap points</label>
    <label><input type="checkbox" data-layer="roads"> Metro Cebu roads</label>
    <label><input type="checkbox" data-layer="nodes"> Road-network nodes</label>
    <label><input type="checkbox" data-layer="transport"> Transport midpoints</label>

    <h2>MCRAI POIs</h2>
    <label><input type="checkbox" data-layer="education"> Education</label>
    <label><input type="checkbox" data-layer="grocery"> Grocery</label>
    <label><input type="checkbox" data-layer="health"> Health</label>
    <label><input type="checkbox" data-layer="hospitals"> Hospitals</label>
    <label><input type="checkbox" data-layer="recreation"> Recreation</label>
    <label><input type="checkbox" data-layer="security"> Security</label>
    <label><input type="checkbox" data-layer="tourism"> Tourism</label>
    <label><input type="checkbox" data-layer="retail"> Retail density</label>

    <h2>Reference / Legacy Layers</h2>
    <label><input type="checkbox" data-layer="legacyTransport"> Legacy MCRAI transport POIs</label>
    <label><input type="checkbox" data-layer="itparkOsm"> IT Park OSM amenities 1 km</label>
    <label><input type="checkbox" data-layer="itparkGoogle"> IT Park Google amenities 1 km</label>

    <div class="legend">
      <span class="swatch" style="background:#2563eb"></span><span>Listings</span>
      <span class="swatch" style="background:#e11d48"></span><span>Valuation gap</span>
      <span class="swatch" style="background:#0f766e"></span><span>Transport / POIs</span>
      <span class="swatch line" style="background:#4b5563"></span><span>Roads</span>
    </div>
    <div id="status" class="status">Loading layers...</div>
  </aside>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script>
    const map = L.map('map', { preferCanvas: true }).setView([10.3157, 123.8854], 11);
    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
      maxZoom: 19,
      attribution: '&copy; OpenStreetMap contributors'
    }).addTo(map);

    const paths = {
      lgu: 'thesis_main/QGIS/data/lgu_boundaries.geojson',
      listings: 'thesis_main/QGIS/data/abt_clean.geojson',
      valuation: 'thesis_main/QGIS/data/valuation_gap.geojson',
      roads: 'thesis_main/QGIS/data/metro_cebu_roads.geojson',
      nodes: 'thesis_main/QGIS/data/metro_cebu_nodes.geojson',
      transport: 'thesis_main/QGIS/data/transport_midpoints.geojson',
      education: 'thesis_main/QGIS/data/mcrai_pois/mcrai_education_pois.geojson',
      grocery: 'thesis_main/QGIS/data/mcrai_pois/mcrai_grocery_pois.geojson',
      health: 'thesis_main/QGIS/data/mcrai_pois/mcrai_health_pois.geojson',
      hospitals: 'thesis_main/QGIS/data/mcrai_pois/mcrai_hospitals_pois.geojson',
      recreation: 'thesis_main/QGIS/data/mcrai_pois/mcrai_recreation_pois.geojson',
      security: 'thesis_main/QGIS/data/mcrai_pois/mcrai_security_pois.geojson',
      tourism: 'thesis_main/QGIS/data/mcrai_pois/mcrai_tourism_pois.geojson',
      retail: 'thesis_main/QGIS/data/mcrai_pois/mcrai_retail_density_pois.geojson',
      legacyTransport: 'thesis_main/QGIS/data/mcrai_pois/mcrai_transport_pois.geojson',
      itparkOsm: 'thesis_main/QGIS/data/cebu_itpark_amenities_1km.geojson',
      itparkGoogle: 'thesis_main/QGIS/data/cebu_itpark_google_amenities_1km.geojson'
    };

    const layerStyles = {
      lgu: { color: '#111827', weight: 2, fillOpacity: 0.04 },
      roads: { color: '#4b5563', weight: 1, opacity: 0.45 }
    };
    const pointColors = {
      listings: '#2563eb', valuation: '#e11d48', nodes: '#64748b', transport: '#0f766e',
      education: '#7c3aed', grocery: '#16a34a', health: '#dc2626', hospitals: '#be123c',
      recreation: '#0891b2', security: '#ca8a04', tourism: '#db2777', retail: '#ea580c'
      , legacyTransport: '#0d9488', itparkOsm: '#4338ca', itparkGoogle: '#9333ea'
    };
    const layers = {};
    const status = document.getElementById('status');
    const checked = key => document.querySelector(`[data-layer="${key}"]`)?.checked;

    function popupHtml(props) {
      const pairs = Object.entries(props || {}).slice(0, 8);
      return pairs.map(([k, v]) => `<b>${k}</b>: ${v ?? ''}`).join('<br>');
    }

    function pointLayer(key, feature, latlng) {
      const radius = key === 'listings' ? 3 : key === 'valuation' ? 4 : 2.5;
      return L.circleMarker(latlng, {
        radius,
        color: pointColors[key],
        weight: 1,
        fillColor: pointColors[key],
        fillOpacity: key === 'nodes' ? 0.35 : 0.7
      });
    }

    async function loadLayer(key) {
      const res = await fetch(paths[key]);
      if (!res.ok) throw new Error(`${key}: ${res.status}`);
      const data = await res.json();
      const layer = L.geoJSON(data, {
        style: layerStyles[key] || undefined,
        pointToLayer: (feature, latlng) => pointLayer(key, feature, latlng),
        onEachFeature: (feature, layer) => layer.bindPopup(popupHtml(feature.properties))
      });
      layers[key] = layer;
      if (checked(key)) layer.addTo(map);
      return `${key}: ${(data.features || []).length.toLocaleString()} features`;
    }

    document.querySelectorAll('input[data-layer]').forEach(input => {
      input.addEventListener('change', e => {
        const key = e.target.dataset.layer;
        if (!layers[key]) return;
        e.target.checked ? layers[key].addTo(map) : map.removeLayer(layers[key]);
      });
    });

    Promise.all(Object.keys(paths).map(loadLayer))
      .then(lines => {
        status.textContent = lines.join('\n');
        const bounds = layers.lgu.getBounds();
        if (bounds.isValid()) map.fitBounds(bounds.pad(0.08));
      })
      .catch(err => {
        status.textContent = `Layer load error: ${err.message}`;
      });
  </script>
</body>
</html>
